name: Back-End
on:
  push:
    tags:
      - 'v*b'


jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCESS_TOKEN_EXPIRE: ${{ secrets.ACCESS_TOKEN_EXPIRE }}
      REFRESH_TOKEN_EXPIRE: ${{ secrets.REFRESH_TOKEN_EXPIRE }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      PROD: ${{secrets.PROD}}

    steps:
      - name: Instala o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'

      - name: Copia os arquivos do repositório
        uses: actions/checkout@v4

      - name: Instala o poetry
        run: pipx install poetry

      - name: Instala Kerberos development tools
        run: sudo apt-get update && sudo apt-get install -y krb5-config libkrb5-dev

      - name: Instala dependências
        run: poetry install

      - name: Verifica formatação
        run: poetry run task lint

      - name: Executa testes
        run: poetry run pytest --cov --cov-branch --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
