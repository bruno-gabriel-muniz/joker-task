services:

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://joker:joker@db:5432/jokertask
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: joker
      POSTGRES_PASSWORD: joker
      POSTGRES_DB: jokertask
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joker -d jokertask"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"